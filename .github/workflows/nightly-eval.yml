name: nightly-eval
on:
  schedule: [{ cron: '0 18 * * *' }]   # KST 03:00
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # ⚠️ 이 블록은 **잡 레벨**에 있어야 한다. 스텝으로 내리지 마라 (T-046).
    #
    # 이전 판은 이것이 `pnpm eval:injection` **스텝 하나에만** 붙어 있었다. YAML 의
    # `env:` 는 그 스텝에만 적용되므로 앞의 세 eval 은 자격증명 없이 돌았고, 러너는
    # 자격증명이 없으면 **아무것도 재지 않고 EX_CONFIG(78)로 거절한다**(설계대로다 —
    # `eval/retrieval/run.cli.ts` 서두). 스텝 하나가 78 로 죽으면 잡이 거기서 끝나므로
    # `eval:injection` 은 **한 번도 실행된 적이 없다.** 즉 이 워크플로는 배선된 이래
    # 아무것도 잰 적이 없고, 그 사실을 보는 단언이 없어 아무도 알아채지 못했다.
    #
    # 되돌리면 `tools/workflow-contract.spec.ts` 가 빨개진다. 그 테스트가 이 주석의
    # 근거이고, 이 주석이 그 테스트의 근거다.
    #
    # 값은 **전부 참조다.** 리터럴 시크릿을 여기 적지 마라 (CLAUDE.md 금지사항) —
    # 워크플로 파일은 레포에 평문으로 남는다. 어느 시크릿이 필요한지 **이름**을 적는
    # 것은 괜찮다. 값이 문제다.
    # -----------------------------------------------------------------------
    env:
      # --- 자격증명 (Settings → Secrets) ---
      MONGODB_URI: ${{ secrets.MONGODB_TEST_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # retrieval 이 요구한다. 이전 판에는 **파일 어디에도 없었다** — 그래서
      # 자격증명을 스텝에 붙여도 `EMBEDDING_PROVIDER=voyage` 경로는 여전히 죽었다.
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # `<key>:<projectSlug>` 목록. `eval/retrieval/args.ts` 의 resolveEvalApiKey 가
      # 여기서 project 키를 고른다 — 없으면 키를 만들어내지 않고 던진다.
      API_KEYS: ${{ secrets.EVAL_API_KEYS }}

      # --- 설정 (Settings → Variables). 시크릿이 아니지만 **코드에 기본값이 없다** ---
      # 모델 ID 를 리터럴로 박으면 세대 교체가 워크플로 수정이 된다. `infra/deploy/deploy.sh`
      # 가 모델명을 박지 않는 것과 같은 규약이고, `no-hardcoded-model.spec.ts` 가 코드
      # 쪽에서 같은 것을 막는다.
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM }}
      EMBEDDING_VERSION: ${{ vars.EMBEDDING_VERSION }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - run: pnpm eval:retrieval
      - run: pnpm eval:generation
      - run: pnpm eval:tools
      - run: pnpm eval:injection
      # specs/08 §6 의 문체 eval. 목록에 아예 빠져 있었다 (T-046).
      # ⚠️ `eval/baselines.json` 에 `style` 기준선이 아직 없어 이 스텝은 현재
      #    BASELINE_MISSING → 78 로 끝난다. 그것이 **정직한 상태다** — 기준선 없이
      #    낸 판별 정확도는 고장 난 실행일수록 좋은 점수가 나온다(러너 서두).
      #    기준선을 쓰는 것은 사람의 몫이고, 그때까지 이 빨간불이 그 부채를 가리킨다.
      - run: pnpm eval:style

      - uses: actions/upload-artifact@v4
        with: { name: eval-reports, path: eval/reports/ }

      # -------------------------------------------------------------------
      # 리포트 시계열은 포트폴리오 자산이므로 저장소에 커밋한다 (specs/05, 감사 A-4)
      #
      # ⚠️ **— 라는 것이 의도였고, 실제로는 이 스텝이 아무 일도 하지 않는다.**
      #    고치지 마라. 인간 비준 대기다 (T-046).
      #
      # `specs/05` 는 "리포트는 `eval/reports/YYYY-MM-DD-*.json` 커밋"을 요구하는데
      # `.gitignore:23` 의 `eval/reports/*` 가 그것을 차단한다. 실제로
      # `git ls-files eval/reports` 는 `.gitkeep` 하나뿐이고, 아래 `git add` 는
      # 언제나 빈 스테이지를 만든다 → `git diff --cached --quiet` 가 참 → 커밋도
      # 푸시도 일어나지 않는다. 즉 위 주석이 선언한 시계열 자산은 **성립한 적이 없다.**
      #
      # 이것은 버그가 아니라 **스펙 대 레포 설정의 모순**이다. `.gitignore` 를 여는
      # 쪽인지 `specs/05` 의 커밋 요구를 접고 artifact 보존으로 가는 쪽인지는 사람이
      # 정한다 (T-046 Out of scope). 그때까지 위 `upload-artifact` 가 유일한 보존
      # 경로이고, 그것은 90일 후 사라진다.
      # -------------------------------------------------------------------
      - name: commit reports
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add eval/reports/
          git diff --cached --quiet || git commit -m "chore(eval): nightly reports $(date -I)"
          git push
