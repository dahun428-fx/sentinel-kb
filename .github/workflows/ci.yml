name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # ---------------------------------------------------------------------
      # atlas-local 이미지 캐시 (T-010 F-4).
      #
      # 이미지가 ~1.95GB라 첫 실행이 느리다. `docker save`/`load`로 GH 캐시에 태운다.
      #
      # 키에 **주(week)를 넣는다.** 태그가 `:latest`라 키가 고정이면 한 번 캐시된 이미지가
      # 영원히 고정되고, 그건 캐시가 아니라 **의도치 않은 핀**이다. 주 단위로 회전시키면
      # 최대 일주일까지만 낡는다 — 그리고 그 일주일 동안은 매 실행이 같은 이미지를 보므로
      # 움직이는 `:latest`를 매번 pull하는 것보다 오히려 재현성이 좋다.
      #
      # ⚠️ 이 캐시가 실제로 더 빠른지는 **CI에서만 측정된다.** 로컬에서 판정할 수 없다.
      #    첫 몇 실행의 소요를 보고 이득이 없으면 이 세 스텝을 지우면 된다.
      # ---------------------------------------------------------------------
      - id: atlas-key
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"
      - id: atlas-cache
        uses: actions/cache@v4
        with:
          path: /tmp/atlas-local.tar
          key: atlas-local-${{ steps.atlas-key.outputs.week }}
      - name: atlas-local 이미지 준비
        run: |
          set -euo pipefail
          IMAGE=mongodb/mongodb-atlas-local:latest
          if [ -f /tmp/atlas-local.tar ]; then
            docker load -i /tmp/atlas-local.tar
          else
            docker pull "$IMAGE"
            docker save -o /tmp/atlas-local.tar "$IMAGE"
          fi

      # ---------------------------------------------------------------------
      # 통합 테스트.
      #
      # `REQUIRE_DOCKER=1`이 핵심이다 (T-010 F-5). docker가 없으면 atlas-local이 필요한
      # 스펙들이 `describe.skipIf`로 통째로 건너뛰고 **exit 0**을 낸다. stderr 배너는
      # 찍히지만 **배너는 게이트가 아니다** — 아무도 안 읽으면 "docker가 없으니 그린"이
      # 그대로 머지된다. 이 플래그가 그 skip을 하드 실패로 승격한다
      # (`tools/require-docker.int.spec.ts`).
      # ---------------------------------------------------------------------
      - run: pnpm test:integration
        env:
          EMBEDDING_PROVIDER: fake
          REQUIRE_DOCKER: "1"
      - run: pnpm build

  # -------------------------------------------------------------------------
  # 배포 설정 정적 검사 (T-026). 앱 테스트와 분리한 이유는 이쪽이 **자격증명도
  # 의존성 설치도 필요 없이** 판정되기 때문이다 — 빨리 실패하는 게이트를 앞에 둔다.
  # -------------------------------------------------------------------------
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose 파일이 해소된다 (base + prod 오버레이)
        run: |
          set -euo pipefail
          # 값은 전부 더미다 — 형태만 맞추면 `config`는 해소된다. **실제 시크릿이 아니다.**
          cat > /tmp/ci.env <<'ENV'
          API_KEYS=cikey:sentinel-kb
          MONGODB_URI=mongodb+srv://user:pass@cluster/sentinel
          EMBEDDING_MODEL=voyage-3
          ANTHROPIC_API_KEY=sk-ci
          ANTHROPIC_MODEL=claude-opus-5
          CORE_API_KEY=cikey
          AWS_REGION=ap-northeast-2
          LOG_GROUP_NAME=/sentinel-kb/prod/app
          ECR_REGISTRY=111122223333.dkr.ecr.ap-northeast-2.amazonaws.com
          IMAGE_TAG=ci
          DOMAIN_NAME=kb.example.com
          CERTBOT_EMAIL=ops@example.com
          ENV
          docker compose --env-file /tmp/ci.env -f docker-compose.yml config >/dev/null
          docker compose --env-file /tmp/ci.env \
            -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      - name: 필수 env가 없으면 compose가 **거절한다**
        run: |
          set -euo pipefail
          # 오설정이 조용한 기본값으로 흡수되면 안 된다 (시드 INC-07과 같은 계열).
          if docker compose -f docker-compose.yml --env-file /dev/null config >/dev/null 2>&1; then
            echo "::error::필수 env 없이도 compose 설정이 해소됐다 — 오설정이 조용히 통과한다"
            exit 1
          fi

      - name: nginx 설정이 유효하다 (include 경로가 전부 해소된다)
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.nginx -t sentinel-kb-nginx:ci .
          # 실제 업스트림 이름은 compose 네트워크에서만 해소되므로 CI에서는 더미로 바꾼다.
          # 검사 대상은 라우팅·스니펫 include이지 DNS가 아니다.
          cat > /tmp/upstreams.conf <<'CONF'
          upstream core_api_upstream { server 127.0.0.1:3001; }
          upstream mcp_upstream      { server 127.0.0.1:3002; }
          upstream web_upstream      { server 127.0.0.1:3000; }
          CONF

          # prod 서버 블록은 인증서 **파일**을 요구한다(없으면 nginx가 emerg로 죽는다).
          # 문법 검사가 목적이므로 자체 서명 더미를 호스트에서 만들어 물린다.
          # nginx:alpine에는 openssl CLI가 없어 컨테이너 안에서 만들 수 없다(확인함).
          DOMAIN=kb.example.com
          mkdir -p "/tmp/letsencrypt/live/$DOMAIN"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$DOMAIN" \
            -keyout "/tmp/letsencrypt/live/$DOMAIN/privkey.pem" \
            -out "/tmp/letsencrypt/live/$DOMAIN/fullchain.pem" 2>/dev/null

          for mode in dev prod; do
            docker run --rm -e NGINX_MODE=$mode -e DOMAIN_NAME="$DOMAIN" \
              -v /tmp/upstreams.conf:/etc/nginx/conf.d/00-upstreams.conf:ro \
              -v /tmp/letsencrypt:/etc/letsencrypt:ro \
              --entrypoint sh sentinel-kb-nginx:ci -c '
                set -e
                /docker-entrypoint.d/20-select-server-conf.sh
                nginx -t
              '
          done

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # specs/의 검증 가능한 주장(엔드포인트·도구 개수·필드명)과 코드 대조.
      # 실패해도 머지는 막지 않고 경고만 — 스펙 수정은 사람 판단 사항이므로.
      - run: ./scripts/spec-drift-check.sh || echo "::warning::스펙-코드 불일치 발견"
