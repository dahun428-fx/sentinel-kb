# 업스트림 정본. compose 서비스 이름 = DNS 이름이다 (T-026, specs/06 라우팅표).
#
# 이 파일만 따로 둔 이유: `tools/nginx-streaming.int.spec.ts`가 이 파일 하나를 테스트용으로
# 갈아끼우고 `snippets/routes.conf`는 **실물 그대로** 검증한다. 라우팅·버퍼링 설정이
# 테스트용 사본이면 그 테스트는 아무것도 지키지 못한다.
#
# keepalive: 업스트림 연결을 재사용한다. `proxy-common.conf`가 `Connection ""`을 세워야
# 실제로 동작한다 — 둘은 한 쌍이다.

# 이름을 기동 시 한 번만 해석하면, 컨테이너를 다시 만들어 IP가 바뀐 뒤에도 옛 IP로 보내 502가 난다(T-064, 실측:
# core-api만 재생성 → nginx는 172.21.0.3, core-api는 172.21.0.2). Docker 내장 DNS를 10초마다 다시 읽는다.
# `server … resolve`는 공유 메모리 `zone`이 있어야 하고, 오픈소스 nginx 1.27.3부터 쓸 수 있다(이미지는 1.29).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream core_api_upstream {
    zone core_api_upstream 64k;
    server core-api:3001 resolve;
    keepalive 16;
}

upstream mcp_upstream {
    zone mcp_upstream 64k;
    server mcp:3002 resolve;
    keepalive 16;
}

upstream web_upstream {
    zone web_upstream 64k;
    server web:3000 resolve;
    keepalive 16;
}
