# 업스트림 정본. compose 서비스 이름 = DNS 이름이다 (T-026, specs/06 라우팅표).
#
# 이 파일만 따로 둔 이유: `tools/nginx-streaming.int.spec.ts`가 이 파일 하나를 테스트용으로
# 갈아끼우고 `snippets/routes.conf`는 **실물 그대로** 검증한다. 라우팅·버퍼링 설정이
# 테스트용 사본이면 그 테스트는 아무것도 지키지 못한다.
#
# keepalive: 업스트림 연결을 재사용한다. `proxy-common.conf`가 `Connection ""`을 세워야
# 실제로 동작한다 — 둘은 한 쌍이다.

upstream core_api_upstream {
    server core-api:3001;
    keepalive 16;
}

upstream mcp_upstream {
    server mcp:3002;
    keepalive 16;
}

upstream web_upstream {
    server web:3000;
    keepalive 16;
}
