# 로컬 compose용 서버 블록 (T-026). TLS 없음 — 인증서는 로컬에서 발급할 수 없다.
# 라우팅과 스트리밍 설정은 prod와 **같은 파일**을 include한다. 그것이 이 분리의 요점이다.
server {
    listen 80 default_server;
    server_name _;

    # 로컬에서도 스트리밍 절단을 재현할 수 있어야 한다.
    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/snippets/routes.conf;
}
