# 프로덕션 서버 블록 (T-026, specs/06). `${DOMAIN_NAME}`은 엔트리포인트가 envsubst한다.
#
# 80은 SG가 열지 않으므로 **외부에서 도달하지 않는다.** 그럼에도 리다이렉트 블록을 남기는
# 이유는 (a) 같은 호스트 안의 오설정된 클라이언트를 조용히 실패시키지 않기 위해서고,
# (b) certbot을 HTTP-01로 되돌리려는 다음 사람에게 "80은 닫혀 있다"를 코드로 알리기 위해서다.
# **ACME 챌린지는 DNS-01이다** — `docker/certbot/README.md` 참조.
server {
    listen 80;
    server_name ${DOMAIN_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    client_max_body_size 2m;

    # CloudWatch awslogs 드라이버가 stdout/stderr를 걷어 간다 (specs/06 관측 행).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/snippets/routes.conf;
}
