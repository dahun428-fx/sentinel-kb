# ===========================================================================
# web 표면(`/`)의 HTTP Basic 인증 (T-042, specs/00 NFR-04).
#
# 감사 B-1: `packages/web/src` 전체에 인증 문자열이 0건이다. 도메인에 도달하는 누구나
# 전 프로젝트 레코드를 열람하고 **아티클을 발행**할 수 있었다. specs/08 §7의 "사람 승인"이
# 승인자 무관 상태로 구현돼 있었다 — 강제되던 것은 "사람이 눌렀다"이지
# "**권한 있는** 사람이 눌렀다"가 아니었다.
#
# ⚠️ **이것은 NFR-04의 부분 충족이다.** Basic 인증은 자격증명 하나가 web 전체를 열고
#    **프로젝트별 키를 구분하지 못한다.** 통과한 사용자는 여전히 남의 project 아티클을
#    발행할 수 있다(감사 B-2, 별도 비준 대기). 근거와 한계는 specs/06 "web 표면 인증" 절.
#
# ## 이 파일을 include하는 곳
# `snippets/routes.conf`의 `location /` **하나뿐이다.** server 블록에 걸지 않는 것이 요점이다 —
# server 레벨에 걸면 `= /health`가 상속받아 **모니터가 401을 받는다**(specs/06 관측 행).
# nginx의 auth_basic은 location마다 독립이라, 여기 두면 `/mcp`·`/v1`의 Bearer 경로도
# 건드리지 않는다. 그 둘의 인증은 core-api·MCP가 자기 계층에서 한다(T-007, T-014).
#
# ## 자격증명 파일
# 이미지에 굽지 않고 런타임에 마운트한다(CLAUDE.md 시크릿 금지). 경로는 컨테이너 고정이고
# 호스트 쪽 경로는 `WEB_BASIC_AUTH_FILE`이 준다(docker-compose.yml). 프로덕션에서는 이 파일이
# 손으로 만들어지지 않는다 — SSM Parameter Store(SecureString)에서 배포 시 렌더된다.
#
# 파일이 없으면 nginx는 `/`에 500을 낸다 — **열리는 것이 아니라 닫힌다.** 실패 방향이
# 이쪽인 것은 의도적이다.
# ===========================================================================
auth_basic           "sentinel-kb";
auth_basic_user_file /etc/nginx/secrets/htpasswd;
