# ===========================================================================
# 라우팅 정본. specs/06 "nginx 라우팅"의 구현이다 (T-026).
#
#   /mcp   → mcp:3002       (Streamable HTTP — 스트리밍)
#   /v1    → core-api:3001  (SSE `/v1/answer` 포함 — 스트리밍)
#   /health→ core-api:3001  (⚠️ specs/06 표에 없다. 아래 주석 참조)
#   /      → web:3000
#
# **dev·prod 서버 블록이 이 파일 하나를 include한다.** 라우팅이 두 벌이 되면 한쪽만
# 고쳐지고, 그 차이는 배포 후에야 드러난다.
#
# 업스트림 이름은 `conf.d/00-upstreams.conf`가 정의한다. 분리한 이유는 통합 테스트가
# 그 파일만 갈아끼워 **이 파일을 실물 그대로** 검증할 수 있게 하기 위해서다
# (`tools/nginx-streaming.int.spec.ts`).
# ===========================================================================

# --- /mcp ------------------------------------------------------------------
location /mcp {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/proxy-streaming.conf;
    proxy_pass http://mcp_upstream;
}

# --- /v1 -------------------------------------------------------------------
# 스트리밍 설정을 `= /v1/answer`에만 좁게 걸지 않고 `/v1` 전체에 건다. 좁게 걸면 나중에
# 추가되는 스트리밍 라우트가 조용히 버퍼링된 채로 뜨고, 그 사고는 배포 후에야 보인다.
# 버퍼링을 끈 대가는 비스트리밍 응답의 소폭 오버헤드뿐이다 — INC-06 재발 비용과 비교가 안 된다.
location /v1 {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/proxy-streaming.conf;
    proxy_pass http://core_api_upstream;
}

# --- /health ---------------------------------------------------------------
# ⚠️ specs/06 라우팅표에는 이 줄이 **없다**. 그런데 같은 문서의 관측 행이 "`/health` 모니터"를
#    요구하고, SG는 443만 연다. 표대로면 외부 모니터의 `/health`는 `/`로 흘러 **web UI**에
#    닿는다 — core-api가 죽어도 초록인 모니터가 된다.
#    exact match(`=`)라 다른 경로를 가리지 않는다. specs/06 라우팅표에 이 줄을 추가하는
#    문면 정정이 필요하다(인간 비준 대기, T-026 Findings F-1).
#    `/health`는 인증 면제 경로다(`packages/api/src/auth.ts`의 PUBLIC_PATHS).
location = /health {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://core_api_upstream;
}

# --- / ---------------------------------------------------------------------
location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://web_upstream;
}
