# ===========================================================================
# 스트리밍 경로 전용 프록시 설정 (T-026, specs/06 "nginx 라우팅").
#
# ⚠️ 이 파일이 이 태스크의 존재 이유다. 시드 INC-06이 바로 이 사건이다 —
#    nginx가 SSE를 버퍼링해 MCP 세션이 30초에 끊겼다.
#
# ## 코드 방어선으로는 부족하다
# `packages/api/src/answer.ts`가 `X-Accel-Buffering: no`를 실어 보낸다(T-019). nginx는
# 그 헤더를 존중해 **그 응답에 한해** 버퍼링을 끈다. 그런데 그것으로 닫히지 않는 구멍이
# 둘 남는다:
#   1. `proxy_read_timeout`은 **전혀 건드리지 못한다.** 기본 60초라, 모델이 60초 넘게
#      말이 없으면 nginx가 업스트림 연결을 끊는다. INC-06의 30초 절단이 이 계열이다.
#   2. 헤더를 보내지 않는 경로(MCP의 GET 스트림 등)에는 아예 적용되지 않는다.
# → **설정으로 닫는다.** 코드 방어선은 이중화지 대체재가 아니다.
#
# ## specs/06 문면과의 차이 (인간 비준 대기)
# specs/06의 라우팅표는 `proxy_buffering off, read_timeout 300s`를 **`/mcp`에만** 적었다.
# 그런데 `/v1/answer`가 `text/event-stream`으로 답한다(T-019). `/v1`이 버퍼링된 채로
# 남으면 SSE 절단이 MCP가 아니라 core-api 쪽에서 그대로 재발한다.
# → 이 스니펫은 `/mcp`와 `/v1` **양쪽**에 걸린다. specs/06 18행의 문면 정정이 필요하다.
# ===========================================================================

# 응답을 모아 두지 않고 받는 즉시 클라이언트로 흘린다. **SSE의 전부다.**
proxy_buffering off;
# 요청 본문도 모으지 않는다. `/v1/answer`는 POST라 이게 없으면 요청 쪽에 지연이 생긴다.
proxy_request_buffering off;
# 버퍼링을 껐어도 캐시가 켜져 있으면 nginx가 응답을 다시 모은다.
proxy_cache off;

# 업스트림 무응답 허용 시간. **기본 60s로는 긴 생성이 잘린다** (INC-06).
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# gzip은 압축 블록이 찰 때까지 출력을 붙든다 — 버퍼링을 끈 의미를 지운다.
gzip off;

# HTTP/1.1 chunked로 흘린다. 길이를 미리 모르는 스트림이라 Content-Length가 없다.
chunked_transfer_encoding on;
